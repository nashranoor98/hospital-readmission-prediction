name: Execute Hospital Notebook

on:
  push:
    branches: [main]
    paths:
      - "CaseStudy1.ipynb"
      - ".github/workflows/execute-hospital-notebook.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.0" "numpy>=1.24" "scikit-learn>=1.3" "matplotlib>=3.7" "seaborn>=0.12" "jupyter>=1.0" "nbconvert>=7.0" "nbformat>=5.0" "ipykernel>=6.0"

      - name: Execute notebook and embed outputs
        run: |
          jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=900 CaseStudy1.ipynb

      - name: Remove external graph files
        run: |
          rm -rf graphs

      - name: Commit executed notebook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CaseStudy1.ipynb graphs
          if git diff --cached --quiet; then
            echo "No notebook changes to commit."
          else
            git commit -m "Embed verified notebook outputs"
            git push
          fi
